name: CI
 
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
 
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # env:
    #   SCCACHE_GHA_ENABLED: "true"
    #   RUSTC_WRAPPER: "sccache"
    #   SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
 
      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
 
      # - name: Run sccache-cache
      #   uses: mozilla-actions/sccache-action@v0.0.7

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check
 
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
 
      - name: Run tests with coverage
        run: cargo llvm-cov nextest --lcov --output-path lcov.info
 
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
 
  mutants:
    needs: build-and-test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
 
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
 
      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2
 
      - name: Determine diff range
        id: diff-range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.base_ref }}...HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}...${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
 
      - name: Run cargo-mutants on diff
        run: cargo mutants --in-diff <(git diff ${{ steps.diff-range.outputs.range }}) -- --all-targets
 
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out
